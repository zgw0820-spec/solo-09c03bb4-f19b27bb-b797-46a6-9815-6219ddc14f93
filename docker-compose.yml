services:
  inference:
    build:
      context: .
      dockerfile: Dockerfile
    image: device-anomaly-inference:1.0.0
    ports:
      - "${INFERENCE_PORT:-8000}:8000"
    environment:
      # Total budget shared by resident weights and in-flight load reservations.
      # Each model's weights are 296 bytes, so 640 holds two of the three models
      # at a time and forces LRU eviction (or a 503 when both are in flight).
      MODEL_CACHE_BYTES: "${MODEL_CACHE_BYTES:-640}"
      # Simulated scoring latency; keeps Swagger calls observable.
      INFERENCE_DELAY_MS: "${INFERENCE_DELAY_MS:-250}"
      # Simulated weight-read latency; useful for exercising concurrency.
      MODEL_LOAD_DELAY_MS: "${MODEL_LOAD_DELAY_MS:-0}"
      MODEL_DIR: "/srv/models"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
